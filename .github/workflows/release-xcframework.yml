name: Release XCFramework

# 推送 v* 标签时构建二进制并发布到商户分发仓库；手动触发只构建并上传 Artifact。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # 商户可见的分发仓库（只放 Package.swift 与 xcframework.zip）
  DIST_REPO: komorebicqd/ios-device-fp-dist

jobs:
  build-xcframework:
    name: 构建 XCFramework
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 打印工具链版本
        run: |
          xcodebuild -version
          swift --version

      - name: 构建 XCFramework
        id: build
        run: |
          set -euo pipefail

          bash Scripts/build-xcframework.sh | tee build.log

          CHECKSUM="$(grep '^SHA256=' build.log | cut -d= -f2 | tr -d '[:space:]')"
          if [ -z "${CHECKSUM}" ]; then
            echo "::error::未能从构建输出中解析 SHA256"
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi

          echo "checksum=${CHECKSUM}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${CHECKSUM} version=${VERSION}"

      - name: 生成商户版 Package.swift
        env:
          VERSION: ${{ steps.build.outputs.version }}
          CHECKSUM: ${{ steps.build.outputs.checksum }}
        run: |
          set -euo pipefail
          mkdir -p dist

          cat > dist/Package.swift <<EOF
          // swift-tools-version:5.7
          import PackageDescription

          let package = Package(
              name: "DeviceFingerprintSDK",
              platforms: [.iOS(.v13)],
              products: [
                  .library(name: "DeviceFingerprintSDK", targets: ["DeviceFingerprintSDK"])
              ],
              targets: [
                  .binaryTarget(
                      name: "DeviceFingerprintSDK",
                      url: "https://github.com/${DIST_REPO}/releases/download/v${VERSION}/DeviceFingerprintSDK.xcframework.zip",
                      checksum: "${CHECKSUM}"
                  )
              ]
          )
          EOF

          cat dist/Package.swift

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: DeviceFingerprintSDK-xcframework
          path: |
            .build/distribution/DeviceFingerprintSDK.xcframework.zip
            dist/Package.swift
          if-no-files-found: error

      - name: 发布到商户分发仓库
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIST_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail

          if [ -z "${DIST_TOKEN}" ]; then
            echo "::warning::未配置 DIST_REPO_TOKEN，已跳过发布（产物见 Artifact）"
            exit 0
          fi

          export GH_TOKEN="${DIST_TOKEN}"
          TAG="v${VERSION}"
          CONTENT="$(base64 < dist/Package.swift | tr -d '\n')"

          SHA="$(gh api "repos/${DIST_REPO}/contents/Package.swift" --jq .sha 2>/dev/null || true)"
          if [ -n "${SHA}" ]; then
            gh api -X PUT "repos/${DIST_REPO}/contents/Package.swift" \
              -f message="chore: bump Package.swift to ${TAG}" \
              -f content="${CONTENT}" \
              -f sha="${SHA}" > /dev/null
          else
            gh api -X PUT "repos/${DIST_REPO}/contents/Package.swift" \
              -f message="chore: add Package.swift for ${TAG}" \
              -f content="${CONTENT}" > /dev/null
          fi

          if gh release view "${TAG}" --repo "${DIST_REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG}" --repo "${DIST_REPO}" \
              ".build/distribution/DeviceFingerprintSDK.xcframework.zip" --clobber
          else
            gh release create "${TAG}" --repo "${DIST_REPO}" \
              ".build/distribution/DeviceFingerprintSDK.xcframework.zip" \
              --title "${TAG}" --generate-notes
          fi
